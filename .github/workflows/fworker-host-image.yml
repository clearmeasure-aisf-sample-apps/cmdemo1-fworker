# The worker image for self-hosted Octopus hosts (deploy/octopus, deploy/hosts): Dockerfile.fwrunner, published PRIVATE to
# ghcr.io/clearmeasure-aisf-sample-apps/fworker-host. A push to master builds and pushes the tags <version>, sha-<commit> and latest;
# a pull request builds only (no login, no push). The version is <CLAUDE_CODE_VERSION of Dockerfile.fwrunner>-<run number>.
# The package must be private: GHCR creates it private on the first push from a private context; check it once in the organization's packages.
# The image holds no secret: the Octopus runbooks pass the API keys as env at docker run.
name: fworker-host image

on:
  pull_request:
    paths: [Dockerfile.fwrunner, runner/**, tests/runner/**, .github/workflows/fworker-host-image.yml]
  push:
    branches: [master]
    paths: [Dockerfile.fwrunner, runner/**, tests/runner/**, .github/workflows/fworker-host-image.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/clearmeasure-aisf-sample-apps/fworker-host

jobs:
  # pull requests and runs off master: build and test only, read-only token
  image:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps: &steps
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Tags
        id: tags
        run: |
          claude=$(sed -nE 's/^ARG CLAUDE_CODE_VERSION=([0-9][0-9A-Za-z._-]*)$/\1/p' Dockerfile.fwrunner)
          test -n "$claude" || { echo "::error::Dockerfile.fwrunner pins no ARG CLAUDE_CODE_VERSION"; exit 1; }
          version="${claude}-${GITHUB_RUN_NUMBER}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            if [ "$GITHUB_REF" = refs/heads/master ]; then echo "${IMAGE}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on master)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fwrunner
          load: true
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      - name: Test the entrypoint inside the image
        run: |
          docker run --rm -v "$PWD:/src:ro" -e FWRUNNER_SH=/usr/local/bin/fwrunner.sh --entrypoint bash \
            "${IMAGE}:${{ steps.tags.outputs.version }}" /src/tests/runner/fwrunner.test.sh
          docker run --rm --entrypoint bash "${IMAGE}:${{ steps.tags.outputs.version }}" -c \
            'claude --version && codex --version && cursor-agent --version && gh --version && pwsh -v && git --version && [ "$(id -u)" != 0 ]'

      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while read -r t; do [ -n "$t" ] && docker push "$t"; done <<< "$TAGS"
          echo "Pushed: $(echo "$TAGS" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  # a push (or dispatch) on master: the same steps, and only this job holds packages: write
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps: *steps

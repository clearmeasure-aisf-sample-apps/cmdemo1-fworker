# Tier 1 of the factory worker gateway: the gateway and the fake GitHub are built, then the smoke test and every scenario suite run at the
# full tier (tests/scenarios/run-all.ps1 and run.ps1). No secret, no network beyond the downloads: the suites talk to tests/FakeGitHub.
# Build (build.yml) calls this workflow for every pull request and for a Build started by hand, and its required check "Build result"
# needs it: a red suite blocks the merge exactly as a failed image build does. It does not run for the push that follows a merge (that
# content was tested as the pull request), so the time from a merge to its release is unchanged (a Build of master started by hand does wait for them). Run it alone with `gh workflow run Tests`.
#
# The suites are split over shard jobs of about 3 to 8 minutes each (issue 371), so the longest job, not the sum of the suites, is the time of a
# pull request. Every job runs run-all.ps1 with its list of suites and shards: a plain name is the whole suite in one process, name@g/n is
# group g (from 0) of n of the suite (run.ps1 -Groups n -Group g: its own fake, gateway, ports, HOME and TMPDIR), name@all/n runs all n
# groups of the suite in this job (as qc and messaging split themselves). The owner suite is cut only at its barriers ($OwnerBarriers,
# owner.ps1), as its scenarios build on each other. A job runs at most about 2 of the heavy suites (one pwsh per client and rule-script call)
# at once: beside 3 others on a 4-core runner they ran 4 to 5 times slower than alone.
# A new suite (a new entry in $SuiteDefs of tests/scenarios/run.ps1), or a new scenario, needs no change here when its suite is already in a
# job; a new suite must be added to one of the jobs below. The job "Every scenario is in exactly one shard" fails the run when any scenario
# of `run.ps1 -ListScenarios` is in no job or in two, and "Tests result" fails when a listed scenario has no result.
# Every scenario's writes to the fake GitHub are recorded (TEST_WRITES_DIR) and compared with tests/scenarios/golden where a golden file
# exists; each Tier 1 job uploads its records as the artifact writes-<job>-<attempt> (tests/scenarios/golden/README.md says how to re-record).
# The jobs unit (tests/Gateway.Tests, the gateway in process: routes and their guards, start and stop, in 4 shards) and src (the smoke test and the
# test projects of src/) run the quick tests in minutes. SQL Server is a service of those two and of the job v2 below: the Tier 1 shards do not pass
# a connection to the gateway.
# The jobs "Tier 1 (v2 ...)" (v2 below, a matrix like tier1) are a second engine, not shards: they run the suites and scenarios of tests/scenarios/v2-claims.txt once more with
# run-all.ps1 -Engine v2 (FACTORY_ENVIRONMENT v2ci, or the suite's own name; engine.v2Environments naming it; FACTORY_DB_CONNECTION a SQL Server of its own; the saga profiles of run.ps1 -V2Profile start
# sagas). Those scenarios also run, as before, in the shards. An entry of the v2 matrix names its suites after `claims:`, not `suites:`, so "Every scenario is in exactly one shard" does not read it
# (it runs tests/ci/run-v2-claims.py, which proves that every claim of the file is in exactly one v2 entry), and the jobs upload v2-results-*, not suite-results-*, so "Tests result" does not count
# their scenarios a second time. Until the first green run of Tests on master they are reported by "Tests result" and do not fail it (V2_BLOCKING there). The job "Image starts without a database"
# builds the image and starts it with no FACTORY_DB_CONNECTION (the kill-switch case of W2.0): /ready must answer 200.
name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The PowerShell the container image runs (Dockerfile, PWSH_VERSION) and the connect prompt downloads.
  PWSH_VERSION: "7.5.4"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  POWERSHELL_TELEMETRY_OPTOUT: "1"
  POWERSHELL_UPDATECHECK: "Off"

jobs:
  tier1:
    name: Tier 1 (${{ matrix.name }})
    runs-on: ubuntu-24.04
    # a shard takes about 6 minutes of suites (issue 371, 2.8); the suites step stops at 16 minutes, and the rest leaves the uploads their time
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # parallel: how many entries of suites run-all.ps1 runs at once (an @all/n entry is n processes on its own)
        include:
          # auto: one process, 40 scenarios, about 2,070 s of scenarios on CI runners (run 40765741009): 8 groups of about 260 s, one per runner
          - name: auto-0
            suites: auto@0/8
            parallel: 1
          - name: auto-1
            suites: auto@1/8
            parallel: 1
          - name: auto-2
            suites: auto@2/8
            parallel: 1
          - name: auto-3
            suites: auto@3/8
            parallel: 1
          - name: auto-4
            suites: auto@4/8
            parallel: 1
          - name: auto-5
            suites: auto@5/8
            parallel: 1
          - name: auto-6
            suites: auto@6/8
            parallel: 1
          - name: auto-7
            suites: auto@7/8
            parallel: 1
          - name: peer-approved
            suites: peer-approved@all/2
            parallel: 1
          - name: merge-queue-a
            suites: merge-queue@0/2,qc-rate
            parallel: 2
          - name: merge-queue-b
            suites: merge-queue@1/2,qc-proxy,repos,saga
            parallel: 2
          # owner: about 2,900 s of scenarios in 10 contiguous groups, cut only at the barriers of owner.ps1 (the largest barrier-to-barrier run is about 410 s); the cuts are the optimal ones for the seconds of scenario-stats.json (Select-GroupShare)
          - name: owner-0
            suites: owner@0/10
            parallel: 1
          - name: owner-1
            suites: owner@1/10
            parallel: 1
          - name: owner-2
            suites: owner@2/10
            parallel: 1
          - name: owner-3
            suites: owner@3/10
            parallel: 1
          - name: owner-4
            suites: owner@4/10
            parallel: 1
          - name: owner-5
            suites: owner@5/10
            parallel: 1
          - name: owner-6
            suites: owner@6/10
            parallel: 1
          - name: owner-7
            suites: owner@7/10
            parallel: 1
          - name: owner-8
            suites: owner@8/10
            parallel: 1
          - name: owner-9
            suites: owner@9/10
            parallel: 1
          # copilot: about 970 s of scenarios in 4 groups of about 245 s
          - name: copilot-0
            suites: copilot@0/4
            parallel: 1
          - name: copilot-1
            suites: copilot@1/4
            parallel: 1
          - name: copilot-2
            suites: copilot@2/4
            parallel: 1
          - name: copilot-3
            suites: copilot@3/4
            parallel: 1
          # promote (slot 28): its group ports 38000-38299 are below the ephemeral range the step "Ephemeral ports above the test ports" sets; one scenario alone is 190 s
          - name: promote-0
            suites: promote@0/3
            parallel: 1
          - name: promote-1
            suites: promote@1/3
            parallel: 1
          - name: promote-2
            suites: promote@2/3
            parallel: 1
          - name: operator
            suites: operator,mcp,envscope,copilot-deadline,cursor-deadline
            parallel: 2
          # runtime alone: beside other suites its settled-background-line goldens failed under load (issue 371 follow-up: runs 40684732381, 40567669960)
          - name: runtime
            suites: runtime
            parallel: 1
          - name: cursor
            suites: cursor
            parallel: 1
          - name: octopus
            suites: octopus,copilot-manager
            parallel: 2
          # qc-gate: its 9 scenarios (about 740 s alone) in 4 groups, one job each (three groups in one job ran about twice as slow as their scenarios alone)
          - name: gate-0
            suites: qc-gate@0/4
            parallel: 1
          - name: gate-1
            suites: qc-gate@1/4
            parallel: 1
          - name: gate-2
            suites: qc-gate@2/4
            parallel: 1
          - name: gate-3
            suites: qc-gate@3/4
            parallel: 1
          # the six one-scenario qc-gate suites, about 1,040 s together: two jobs of 3 at once (the longest alone is 285 s)
          - name: gate-b
            suites: qc-gate-race,qc-gate-grace,qc-gate-idle
            parallel: 3
          - name: gate-c
            suites: qc-gate-lease,qc-gate-waiting,qc-gate-lifetime
            parallel: 3
          # qc-worker: about 750 s of scenarios in 4 groups
          - name: workers-0
            suites: qc-worker@0/4,author
            parallel: 2
          - name: workers-1
            suites: qc-worker@1/4
            parallel: 1
          - name: workers-2
            suites: qc-worker@2/4
            parallel: 1
          - name: workers-3
            suites: qc-worker@3/4
            parallel: 1
          # qc and messaging: their 4 groups in one job, as before (the rule-script pool and the client host: no pwsh per call)
          - name: qc
            suites: qc@all/4
            parallel: 1
          - name: messaging
            suites: messaging@all/4
            parallel: 1
          # manager: about 1,800 s of scenarios in 8 groups of about 230 s, one per runner (three groups in one job failed under load)
          - name: manager-0
            suites: manager@0/8
            parallel: 1
          - name: manager-1
            suites: manager@1/8
            parallel: 1
          - name: manager-2
            suites: manager@2/8
            parallel: 1
          - name: manager-3
            suites: manager@3/8
            parallel: 1
          - name: manager-4
            suites: manager@4/8
            parallel: 1
          - name: manager-5
            suites: manager@5/8
            parallel: 1
          - name: manager-6
            suites: manager@6/8
            parallel: 1
          - name: manager-7
            suites: manager@7/8
            parallel: 1
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      - name: Build the gateway and the fake GitHub
        run: |
          set -euo pipefail
          pwsh --version
          for project in tests/FakeGitHub gateway; do
            dotnet build "$project" --configuration Release -nodeReuse:false -p:UseSharedCompilation=false --verbosity quiet
          done

      # Every port Tier 1 listens on is below 40000: a suite's slot range 6100-8999, a group's 10000 + 1000 * slot + 100 * group + 0..99 (slot
      # at most 29, group at most 9: at most 39999). Linux hands out outgoing (ephemeral) ports from 32768-60999 by default, so a client socket of
      # one suite could take the port a group of a high slot (23 and up: 33000 and up) is about to listen on. This moves that range above them.
      - name: Ephemeral ports above the test ports
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_port_range="40000 60999"
          cat /proc/sys/net/ipv4/ip_local_port_range

      - name: Smoke
        run: pwsh -NoProfile -File tests/smoke.ps1

      - name: Suites ${{ matrix.suites }} (full tier)
        # below the job's 25 minutes, so that a hung shard still uploads its logs and results
        timeout-minutes: 16
        env:
          SUITES: ${{ matrix.suites }}
          PARALLEL: ${{ matrix.parallel }}
          # the fake writes each scenario's record here (run-all.ps1 and the group children inherit it); TEST_GOLDEN unset: compare
          TEST_WRITES_DIR: ${{ runner.temp }}/writes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suite-logs"
          pwsh -NoProfile -File tests/scenarios/run-all.ps1 -Tier full -NoBuild -Parallel "$PARALLEL" -Suites "$SUITES" -LogDir "$RUNNER_TEMP/suite-logs"

      # The result of every suite and shard (checks, scenarios, failures), always: "Tests result" adds them up and proves every scenario ran.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-results-${{ matrix.name }}
          path: ${{ runner.temp }}/suite-logs/*.result.json
          if-no-files-found: warn
          retention-days: 7

      # The logs hold the fixtures of the tests only (the suites know no real credential). run-all.ps1 keeps the work directory of a failed
      # suite only: its gateway logs (gateway.out/err, and those of a restarted gateway) and the PowerShell cache of its HOME (issue 375:
      # every new pwsh of a suite exits 139 across gateway restarts; seen in the octopus, owner and copilot suites).
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suite-logs-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/suite-logs/*.log
            ${{ runner.temp }}/suite-logs/*.err
            ${{ runner.temp }}/suite-logs/*.result.json
            ${{ runner.temp }}/suite-logs/work-*/**/gateway*.out
            ${{ runner.temp }}/suite-logs/work-*/**/gateway*.err
            ${{ runner.temp }}/suite-logs/work-*/*/home/.cache/powershell/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # The golden-write records of every scenario (passed or not), the input of a new baseline (tests/scenarios/golden/README.md); the run
      # attempt in the name lets a re-run upload its own. The directory itself (not a glob) is the artifact's root, so a job of one suite keeps
      # its <suite>/ directory too (Merge-GoldenWrites keys a record by it).
      - name: Keep the records of the writes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writes-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writes
          if-no-files-found: ignore
          retention-days: 14

  # The quick tests, no suite: the gateway in process (tests/Gateway.Tests, 1,150 tests) in 4 shards by test class
  # (tests/ci/shard-dotnet-tests.py: each class in exactly one shard, the filter of a shard proved against the listing before it runs).
  # PowerShell 7.5 beside every shard (the deploy-overrides script test finds it on the PATH and skips without it). SQL Server beside every shard: the SQL-backed Wolverine host tests of Gateway.Tests (WolverineHostSqlServerTests) return early where
  # FACTORY_TEST_SQL is not set, so a shard never runs without it.
  unit:
    name: Gateway tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACTORY_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB;TrustServerCertificate=True;Encrypt=False;Connect Timeout=30"
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB
          MSSQL_MEMORY_LIMIT_MB: "1024"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 10s
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # ConfigurationTests.DeployOverrides_ScriptAgreesWithThePort runs config/apply-overrides.ps1 with the real PowerShell where one is on the PATH (it needs 7.5)
      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      # the service container's health check passed before the steps started (the job waits for it); this proves the port answers from the runner
      - name: SQL Server is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "SQL Server answers on 127.0.0.1:1433"; exit 0; fi
            sleep 2
          done
          echo "::error::the SQL Server service container does not answer on port 1433"; exit 1

      - name: Build the gateway tests
        run: dotnet build tests/Gateway.Tests --configuration Release -nodeReuse:false -p:UseSharedCompilation=false --verbosity quiet

      # the gateway's rule scripts are a stub in these tests (tests/Gateway.Tests/StubPwsh.cs); only the deploy-overrides script test runs the real PowerShell
      - name: Gateway tests, shard ${{ matrix.shard }} of 4
        run: python3 tests/ci/shard-dotnet-tests.py tests/Gateway.Tests ${{ matrix.shard }} 4 --logger "trx;LogFileName=gateway-tests-${{ matrix.shard }}.trx" --results-directory "$RUNNER_TEMP/gateway-tests"

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-tests-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-tests
          if-no-files-found: ignore
          retention-days: 7

  # The smoke test and the test projects of src/ (the Domain rules and parity tests, the workflows; the SQL-backed Wolverine tests among them
  # need the SQL Server service). The project dependency rules are in Gateway.Tests (ArchitectureTests).
  src:
    name: Smoke and src tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACTORY_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB;TrustServerCertificate=True;Encrypt=False;Connect Timeout=30"
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB
          MSSQL_MEMORY_LIMIT_MB: "1024"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 10s
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      - name: Smoke
        run: pwsh -NoProfile -File tests/smoke.ps1

      # the service container's health check passed before the steps started (the job waits for it); this proves the port answers from the runner
      - name: SQL Server is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "SQL Server answers on 127.0.0.1:1433"; exit 0; fi
            sleep 2
          done
          echo "::error::the SQL Server service container does not answer on port 1433"; exit 1

      - name: Domain, integration and workflow tests
        run: |
          set -euo pipefail
          for project in tests/Fworker.Contracts.Tests tests/Fworker.Domain.Tests tests/Fworker.Integrations.Tests tests/Fworker.Workflow.Tests; do
            dotnet test "$project" --configuration Release -nodeReuse:false -p:UseSharedCompilation=false
          done

  # Tier 1 on the v2 engine (issue 467, W2.4a; W9.10d, #552): the claims of tests/scenarios/v2-claims.txt, run by `run-all.ps1 -Engine v2` in matrix jobs like the shards of tier1 above. A claim is a suite (or the
  # scenarios of a suite that a regular expression names) and the test profile of run.ps1 -V2Profile (plain; saga-docs and saga-feature turn the engine's intake on, so that the Todo items of the saga suite
  # start a WorkItemSaga). The gateway under test runs with engine.v2Environments naming FACTORY_ENVIRONMENT (v2ci, or the suite's own name where it sets one: tdd for copilot, promote, envscope), so Engine.V2Acts is
  # true: the Wolverine host, the journal sink, the runtime commands, the recurring jobs and the ingress start, against a database of its own on the SQL Server service (FACTORY_TEST_SQL; run.ps1 adds the database name per
  # process). This is a second engine over the same scenarios and goldens (golden/v2-differences.txt declares where v2 writes differently on purpose), not a shard: an entry names its suites after `claims:`, and no
  # `suites:` line, so "Every scenario is in exactly one shard" does not read it; "Every v2 claim is in exactly one v2 job" (job coverage) checks the claims against these entries. The result files are v2-results-*,
  # which "Tests result" does not add to the suites.
  v2:
    name: Tier 1 (v2 ${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # parallel: how many jobs of run-all.ps1 run at once (a claim by scenarios, a suite or a shard of one is a job)
        include:
          # the suite saga: two claims (docs plan, feature plan), each with its profile
          - name: saga
            claims: saga
            parallel: 2
          # the claims of auto, owner and manager by scenarios (10 claims, a job each)
          - name: partial
            claims: auto,owner,manager
            parallel: 2
          - name: octopus
            claims: octopus,copilot-manager
            parallel: 2
          # promote (tdd, slot 28): 667 s of scenarios in one process on a development machine, 3 shards as in tier1 above
          - name: promote-0
            claims: promote@0/3
            parallel: 1
          - name: promote-1
            claims: promote@1/3
            parallel: 1
          - name: promote-2
            claims: promote@2/3
            parallel: 1
          # qc-worker: 494 s of scenarios in one process on a development machine, 4 shards as in tier1 above
          - name: qc-worker-0
            claims: qc-worker@0/4
            parallel: 1
          - name: qc-worker-1
            claims: qc-worker@1/4
            parallel: 1
          - name: qc-worker-2
            claims: qc-worker@2/4
            parallel: 1
          - name: qc-worker-3
            claims: qc-worker@3/4
            parallel: 1
          # the QC environment suites (policy auto)
          - name: qc-gates-a
            claims: qc-gate,qc-gate-race,qc-gate-grace,qc-gate-lease
            parallel: 2
          - name: qc-gates-b
            claims: qc-gate-idle,qc-gate-lifetime,qc-gate-waiting,qc-rate,qc-proxy
            parallel: 2
          # whole suites of a few minutes each (envscope runs as tdd, with its own environment name)
          - name: small
            claims: repos,envscope,mcp,copilot-deadline,operator,merge-queue
            parallel: 2
    env:
      FACTORY_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB;TrustServerCertificate=True;Encrypt=False;Connect Timeout=30"
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB
          MSSQL_MEMORY_LIMIT_MB: "1024"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 10s
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      # the service container's health check passed before the steps started (the job waits for it); this proves the port answers from the runner
      - name: SQL Server is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "SQL Server answers on 127.0.0.1:1433"; exit 0; fi
            sleep 2
          done
          echo "::error::the SQL Server service container does not answer on port 1433"; exit 1

      - name: Build the gateway and the fake GitHub
        run: |
          set -euo pipefail
          pwsh --version
          for project in tests/FakeGitHub gateway; do
            dotnet build "$project" --configuration Release -nodeReuse:false -p:UseSharedCompilation=false --verbosity quiet
          done

      # Every port Tier 1 listens on is below 40000: a suite's slot range 6100-9199, a group's (and a claim by scenarios') 10000 + 1000 * slot + 100 * n + 0..99 (slot at most 29, n at most 9: at most 39999).
      # Linux hands out outgoing (ephemeral) ports from 32768-60999 by default, so a client socket of one suite could take the port a group of a high slot is about to listen on: this moves that range above them.
      - name: Ephemeral ports above the test ports
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ip_local_port_range="40000 60999"
          cat /proc/sys/net/ipv4/ip_local_port_range

      - name: The claims ${{ matrix.claims }} on the v2 engine (full tier)
        # below the job's 30 minutes, so that a hung job still uploads its logs and results
        timeout-minutes: 22
        env:
          CLAIMS: ${{ matrix.claims }}
          PARALLEL: ${{ matrix.parallel }}
          # the fake writes each scenario's record here and the golden files are compared, as in the shards (TEST_GOLDEN unset: compare)
          TEST_WRITES_DIR: ${{ runner.temp }}/v2-writes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v2-results"
          pwsh -NoProfile -File tests/scenarios/run-all.ps1 -Engine v2 -Tier full -NoBuild -Parallel "$PARALLEL" -Suites "$CLAIMS" -LogDir "$RUNNER_TEMP/v2-results"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v2-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/v2-results/*.result.json
            ${{ runner.temp }}/v2-results/*.log
          if-no-files-found: warn
          retention-days: 7

      # the gateway and fake logs of a failed claim (the fixtures of the tests only): run-all.ps1 keeps the work directory of a failed job only, as for the shards
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v2-logs-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v2-results/*.err
            ${{ runner.temp }}/v2-results/work-*/**/gateway*.out
            ${{ runner.temp }}/v2-results/work-*/**/gateway*.err
            ${{ runner.temp }}/v2-results/work-*/**/fake.out
            ${{ runner.temp }}/v2-results/work-*/**/fake.err
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the records of the writes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writes-v2-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v2-writes
          if-no-files-found: ignore
          retention-days: 14

  # The image starts without a database (issue 459, the kill-switch case of W2.0): the image of the Dockerfile is built here (the Build's own
  # image job is a sibling of this workflow's caller, not an input of it) and run with no FACTORY_DB_CONNECTION, as the uat and prod gateways run;
  # /ready must answer 200 within two minutes, or the job fails with the container's log. No GitHub credential: GH_TOKEN is the vault placeholder
  # unset, so the gateway has no GitHub identity and does not wait for revocations. The secrets it requires at start, and owner mode (the deployed settings need it), are given here; the secrets are made at run time.
  image-start:
    name: Image starts without a database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Build the image
        run: docker build --file Dockerfile --build-arg VERSION=0.0.0 --tag fworker-start-check:ci .

      - name: Run it without FACTORY_DB_CONNECTION; /ready answers 200
        run: |
          set -euo pipefail
          dev_token="$(openssl rand -hex 24)"; webhook_secret="$(openssl rand -hex 24)"; token_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$dev_token"; echo "::add-mask::$webhook_secret"; echo "::add-mask::$token_secret"
          # FACTORY_OWNER_MODE=1 and FACTORY_TOKEN_SECRET are what the deployed app is given (system.json): the image's configuration turns messaging and
          # the manager on, and the gateway refuses to start for either without owner mode (MessagingSettings.Load), and owner mode without a token secret
          docker run --detach --name fworker-start --publish 18080:8080 \
            -e FACTORY_DEV_TOKEN="$dev_token" -e FACTORY_WEBHOOK_SECRET="$webhook_secret" -e FACTORY_TOKEN_SECRET="$token_secret" -e FACTORY_OWNER_MODE=1 -e GH_TOKEN=unset \
            fworker-start-check:ci
          container_env="$(docker exec fworker-start env 2>/dev/null || true)"
          if grep -q '^FACTORY_DB_CONNECTION=' <<<"$container_env"; then echo "::error::the container has FACTORY_DB_CONNECTION set"; exit 1; fi
          code=000
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Running}}' fworker-start)" != "true" ]; then echo "::error::the container stopped before it was ready"; break; fi
            code="$(curl -s -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' http://127.0.0.1:18080/ready || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          echo "/ready: $code"; cat "$RUNNER_TEMP/ready.json" 2>/dev/null || true; echo
          if [ "$code" != "200" ]; then echo "::error::/ready did not answer 200 within 2 minutes (last answer: $code)"; docker logs fworker-start 2>&1 | tail -n 80; exit 1; fi
          curl -fsS http://127.0.0.1:18080/_build; echo
          curl -fsS -o /dev/null http://127.0.0.1:18080/health

      - name: Stop the container
        if: always()
        run: docker rm --force fworker-start || true

  # Every scenario of every suite runs in exactly one shard: the scenarios each matrix entry lists (run.ps1 -ListScenarios -Suite s, with
  # -Groups n -Group g for a shard, every group of an @all/n), added up, are exactly those of run.ps1 -ListScenarios (the full tier), none
  # twice. Its list of scenarios is what "Tests result" compares the results with.
  coverage:
    name: Every scenario is in exactly one shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.1

      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      - name: Every scenario is in exactly one shard
        run: |
          set -euo pipefail
          export LC_ALL=C
          out="$RUNNER_TEMP/coverage"; mkdir -p "$out"
          run=tests/scenarios/run.ps1
          # (only the lines suite<TAB>scenario<TAB>tier: anything else a script prints is not a scenario)
          scenarios() { grep -P '^[^\t]+\t[^\t]+\t(fast|full)$' || true; }
          list() {   # suite [groups group]: that share's scenarios, appended to sharded.tsv
            local part="$out/part.tsv"
            if [ "$#" -eq 1 ]; then pwsh -NoProfile -File "$run" -ListScenarios -Suite "$1" > "$out/raw.txt"
            else pwsh -NoProfile -File "$run" -ListScenarios -Suite "$1" -Groups "$2" -Group "$3" > "$out/raw.txt"; fi
            scenarios < "$out/raw.txt" > "$part"
            local count; count=$(wc -l < "$part")
            echo "$*: $count scenarios"
            if [ "$count" -eq 0 ]; then echo "::warning::$* lists no scenario (an empty shard)"; fi
            cat "$part" >> "$out/sharded.tsv"
          }
          : > "$out/sharded.tsv"
          specs=$(grep -E '^\s+suites: ' .github/workflows/tests.yml | sed -E 's/^\s+suites: //' | tr ',' '\n')
          for spec in $specs; do
            if [[ "$spec" =~ ^([a-z0-9-]+)@all/([0-9]+)$ ]]; then
              suite="${BASH_REMATCH[1]}"; n="${BASH_REMATCH[2]}"
              for ((g = 0; g < n; g++)); do list "$suite" "$n" "$g"; done
            elif [[ "$spec" =~ ^([a-z0-9-]+)@([0-9]+)/([0-9]+)$ ]]; then
              suite="${BASH_REMATCH[1]}"; g="${BASH_REMATCH[2]}"; n="${BASH_REMATCH[3]}"
              list "$suite" "$n" "$g"
            elif [[ "$spec" =~ ^[a-z0-9-]+$ ]]; then
              list "$spec"
            else
              echo "::error::tests.yml: '$spec' is not a suite, name@g/n or name@all/n"; exit 1
            fi
          done
          pwsh -NoProfile -File "$run" -ListScenarios > "$out/raw.txt"
          scenarios < "$out/raw.txt" | sort > "$out/expected.tsv"
          test -s "$out/expected.tsv" || { echo "::error::run.ps1 -ListScenarios listed no scenario"; exit 1; }
          sort "$out/sharded.tsv" > "$out/sharded.sorted.tsv"
          missing=$(comm -23 "$out/expected.tsv" <(sort -u "$out/sharded.sorted.tsv"))
          extra=$(comm -13 "$out/expected.tsv" <(sort -u "$out/sharded.sorted.tsv"))
          twice=$(uniq -d "$out/sharded.sorted.tsv")
          echo "$(wc -l < "$out/expected.tsv") scenarios in run.ps1 -ListScenarios, $(wc -l < "$out/sharded.sorted.tsv") in the shards"
          bad=0
          if [ -n "$missing" ]; then echo "::error::Scenarios in no shard of tests.yml:"; echo "$missing"; bad=1; fi
          if [ -n "$extra" ]; then echo "::error::Scenarios a shard lists that run.ps1 -ListScenarios does not:"; echo "$extra"; bad=1; fi
          if [ -n "$twice" ]; then echo "::error::Scenarios in more than one shard:"; echo "$twice"; bad=1; fi
          test "$bad" -eq 0
          cp "$out/expected.tsv" "$RUNNER_TEMP/scenario-list.tsv"

      # The claims of the v2 engine (W9.10d): the file parses, every claim names a suite of run.ps1 -ListSuites and lists a scenario, and every claimed suite is in exactly one entry (`claims:`) of the v2 matrix
      - name: Every v2 claim is in exactly one v2 job
        run: python3 tests/ci/run-v2-claims.py tests/scenarios/v2-claims.txt --workflow .github/workflows/tests.yml

      - name: Keep the list of scenarios
        uses: actions/upload-artifact@v7
        with:
          name: scenario-list
          path: ${{ runner.temp }}/scenario-list.tsv
          if-no-files-found: error
          retention-days: 7

  # One outcome under a fixed name, for the job of build.yml that calls this workflow. Its summary has the checks and scenarios of every suite
  # (added up over its shards) and in total, to compare with the last green run; it fails when a listed scenario has no result, which catches a
  # shard that ended early without failing.
  result:
    name: Tests result
    needs: [tier1, coverage, unit, src, v2, image-start]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: suite-results-*
          merge-multiple: true
          path: results

      - name: Download the list of scenarios
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: scenario-list
          path: expected

      - name: Every listed scenario has a result; checks per suite
        run: |
          python3 - <<'PY'
          import collections, glob, json, os, sys
          def as_list(v):
              return [] if v is None else (v if isinstance(v, list) else [v])
          expected = collections.Counter()
          listed = collections.Counter()
          have_list = os.path.exists('expected/scenario-list.tsv')
          if have_list:
              for line in open('expected/scenario-list.tsv', encoding='utf-8'):
                  f = line.rstrip('\n').split('\t')
                  if len(f) >= 2:
                      expected[(f[0], f[1])] += 1
                      listed[f[0]] += 1
          suites = collections.OrderedDict()
          ran = collections.Counter()
          files = sorted(glob.glob('results/*.result.json'))
          for path in files:
              r = json.load(open(path, encoding='utf-8-sig'))
              s = suites.setdefault(r.get('suite') or '?', dict(results=0, groups=0, scenarios=0, checks=0, inScenarios=0, failed=0, quarantined=0))
              s['results'] += 1
              s['groups'] += int(r.get('groups') or 1)
              s['checks'] += int(r.get('checks') or 0)
              s['failed'] += int(r.get('failed') or 0)
              s['quarantined'] += len([q for q in as_list(r.get('quarantined')) if q])
              for sc in as_list(r.get('scenarios')):
                  s['scenarios'] += 1
                  s['inScenarios'] += int(sc.get('checks') or 0)
                  ran[(sc.get('suite'), sc.get('name'))] += 1
          out = []
          out.append('### Tier 1: checks and scenarios per suite (full tier)')
          out.append('')
          out.append('`checks` is what the suite reports: the checks of its scenarios plus one invariant check per gateway group (no sweep or internal error in its log).')
          out.append('')
          out.append('| suite | result files | groups | scenarios listed | scenarios run | checks | in scenarios | outside scenarios | failed | quarantined |')
          out.append('|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          tot = collections.Counter()
          for name in sorted(set(suites) | set(listed)):
              s = suites.get(name, dict(results=0, groups=0, scenarios=0, checks=0, inScenarios=0, failed=0, quarantined=0))
              row = dict(s, listed=listed.get(name, 0))
              for k, v in row.items(): tot[k] += v
              out.append(f"| {name} | {row['results']} | {row['groups']} | {row['listed']} | {row['scenarios']} | {row['checks']} | {row['inScenarios']} | {row['checks'] - row['inScenarios']} | {row['failed']} | {row['quarantined']} |")
          out.append(f"| **total** | {tot['results']} | {tot['groups']} | {tot['listed']} | {tot['scenarios']} | **{tot['checks']}** | {tot['inScenarios']} | {tot['checks'] - tot['inScenarios']} | {tot['failed']} | {tot['quarantined']} |")
          missing = sorted((expected - ran).elements())
          extra = sorted((ran - expected).elements())
          twice = sorted(k for k, v in ran.items() if v > 1)
          bad = False
          if not have_list:
              out.append(''); out.append('No list of scenarios (the job "Every scenario is in exactly one shard" did not finish): results not compared.'); bad = True
          if not files:
              out.append(''); out.append('No result file of any shard.'); bad = True
          for title, items in (('Listed scenarios without a result', missing), ('Results of scenarios that are not listed', extra), ('Scenarios that ran more than once', twice)):
              if items and have_list:
                  bad = True
                  out.append(''); out.append(f'**{title}: {len(items)}**'); out.append('')
                  out.extend(f'- {s}: {n}' for s, n in items[:200])
          text = '\n'.join(out) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh: fh.write(text)
          sys.exit(1 if bad else 0)
          PY

      - name: Every suite job succeeded
        if: always()
        env:
          TIER1_RESULT: ${{ needs.tier1.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          SRC_RESULT: ${{ needs.src.result }}
          IMAGE_START_RESULT: ${{ needs.image-start.result }}
          V2_RESULT: ${{ needs.v2.result }}
          # The job "Tier 1 (v2)" is reported here and does not fail this job until it has run green on master (issue 467): a flake of the new engine
          # must not block other merges. Then set this to "true" (a pull request, protected area: workflows) and "Build result" needs it.
          V2_BLOCKING: "false"
        run: |
          echo "tier1: ${TIER1_RESULT}, coverage: ${COVERAGE_RESULT}, unit: ${UNIT_RESULT}, src: ${SRC_RESULT}, image-start: ${IMAGE_START_RESULT}, v2: ${V2_RESULT} (blocking: ${V2_BLOCKING})"
          if [ "${V2_RESULT}" != "success" ]; then
            echo "::warning title=Tier 1 (v2)::the job Tier 1 (v2) ended ${V2_RESULT}; it is not required yet (V2_BLOCKING in tests.yml)"
            echo "**Tier 1 (v2) ended ${V2_RESULT}.** It is reported and not required yet (\`V2_BLOCKING\` in tests.yml)." >> "$GITHUB_STEP_SUMMARY"
            if [ "${V2_BLOCKING}" = "true" ]; then exit 1; fi
          fi
          test "${TIER1_RESULT}" = "success"
          test "${COVERAGE_RESULT}" = "success"
          test "${UNIT_RESULT}" = "success"
          test "${SRC_RESULT}" = "success"
          test "${IMAGE_START_RESULT}" = "success"

# Tier 1 of the factory worker gateway: the gateway and the fake GitHub are built, then the smoke test and every scenario suite run at the
# full tier (tests/scenarios/run-all.ps1 and run.ps1). No secret, no network beyond the downloads: the suites talk to tests/FakeGitHub.
# Build (build.yml) calls this workflow for every pull request and for a Build started by hand, and its required check "Build result"
# needs it: a red suite blocks the merge exactly as a failed image build does. It does not run for the push that follows a merge (that
# content was tested as the pull request), so the time from a merge to its release is unchanged (a Build of master started by hand does wait for them). Run it alone with `gh workflow run Tests`.
#
# The suites are split over shard jobs of about 3 to 8 minutes each (issue 371), so the longest job, not the sum of the suites, is the time of a
# pull request. Every job runs run-all.ps1 with its list of suites and shards: a plain name is the whole suite in one process, name@g/n is
# group g (from 0) of n of the suite (run.ps1 -Groups n -Group g: its own fake, gateway, ports, HOME and TMPDIR), name@all/n runs all n
# groups of the suite in this job (as qc and messaging split themselves). The owner suite is cut only at its barriers ($OwnerBarriers,
# owner.ps1), as its scenarios build on each other. A job runs at most about 2 of the heavy suites (one pwsh per client and rule-script call)
# at once: beside 3 others on a 4-core runner they ran 4 to 5 times slower than alone.
# A new suite (a new entry in $SuiteDefs of tests/scenarios/run.ps1), or a new scenario, needs no change here when its suite is already in a
# job; a new suite must be added to one of the jobs below. The job "Every scenario is in exactly one shard" fails the run when any scenario
# of `run.ps1 -ListScenarios` is in no job or in two, and "Tests result" fails when a listed scenario has no result.
# Every scenario's writes to the fake GitHub are recorded (TEST_WRITES_DIR) and compared with tests/scenarios/golden where a golden file
# exists; each Tier 1 job uploads its records as the artifact writes-<job>-<attempt> (tests/scenarios/golden/README.md says how to re-record).
# The jobs unit (tests/Gateway.Tests, the gateway in process: routes and their guards, start and stop, in 4 shards) and src (the smoke test and the
# test projects of src/) run the quick tests in minutes. SQL Server is a service of those two and of the Tier 1 shards: every Tier 1 process makes a database of its own on it.
# The job "Image starts without a database" builds the image and starts it with no FACTORY_DB_CONNECTION two ways (uat; tdd with v2 configured): /ready must answer 200, 503 "database"
# (v2 inert, up).
name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The PowerShell the container image runs (Dockerfile, PWSH_VERSION) and the connect prompt downloads.
  PWSH_VERSION: "7.5.4"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  POWERSHELL_TELEMETRY_OPTOUT: "1"
  POWERSHELL_UPDATECHECK: "Off"

jobs:
  # Tier 1: the scenario suites against the fake GitHub, on the v2 engine, the only engine (V3.1 of the v2-only plan removed v1's shards and the second run of the claims). A matrix entry lists its
  # suites after `suites:` (name, name@g/n, name@all/n: see the header of this file). The gateway under test runs with engine.v2Environments naming FACTORY_ENVIRONMENT (v2ci, or the suite's own name where it
  # sets one: tdd for copilot, envscope), so Engine.V2Acts is true: the Wolverine host, the journal sink, the runtime commands, the recurring jobs and the ingress start, against a database of its own
  # on the SQL Server service (FACTORY_TEST_SQL; run.ps1 adds the database name per process). The suite saga runs each of its scenarios on a gateway profile of its own (run-all.ps1 $ProfiledSuites).
  # golden/v2-differences.txt declares where the engine writes differently from the golden files on purpose.
  tier1:
    name: Tier 1 (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # parallel: how many entries of suites run-all.ps1 runs at once (an @all/n entry is n processes on its own)
        include:
          # the suite saga: each scenario on a gateway profile of its own (run-all.ps1 $ProfiledSuites)
          - name: saga
            suites: saga
            parallel: 2
          # auto, owner, manager, copilot: whole suites in the groups of the v1 shards above (W9.9c prep, #361); the engine runs the same scenarios and goldens
          - name: auto-0
            suites: auto@0/8
            parallel: 1
          - name: auto-1
            suites: auto@1/8
            parallel: 1
          - name: auto-2
            suites: auto@2/8
            parallel: 1
          - name: auto-3
            suites: auto@3/8
            parallel: 1
          - name: auto-4
            suites: auto@4/8
            parallel: 1
          - name: auto-5
            suites: auto@5/8
            parallel: 1
          - name: auto-6
            suites: auto@6/8
            parallel: 1
          - name: auto-7
            suites: auto@7/8
            parallel: 1
          - name: owner-0
            suites: owner@0/10
            parallel: 1
          - name: owner-1
            suites: owner@1/10
            parallel: 1
          - name: owner-2
            suites: owner@2/10
            parallel: 1
          - name: owner-3
            suites: owner@3/10
            parallel: 1
          - name: owner-4
            suites: owner@4/10
            parallel: 1
          - name: owner-5
            suites: owner@5/10
            parallel: 1
          - name: owner-6
            suites: owner@6/10
            parallel: 1
          - name: owner-7
            suites: owner@7/10
            parallel: 1
          - name: owner-8
            suites: owner@8/10
            parallel: 1
          - name: owner-9
            suites: owner@9/10
            parallel: 1
          - name: manager-0
            suites: manager@0/8
            parallel: 1
          - name: manager-1
            suites: manager@1/8
            parallel: 1
          - name: manager-2
            suites: manager@2/8
            parallel: 1
          - name: manager-3
            suites: manager@3/8
            parallel: 1
          - name: manager-4
            suites: manager@4/8
            parallel: 1
          - name: manager-5
            suites: manager@5/8
            parallel: 1
          - name: manager-6
            suites: manager@6/8
            parallel: 1
          - name: manager-7
            suites: manager@7/8
            parallel: 1
          - name: copilot-0
            suites: copilot@0/4
            parallel: 1
          - name: copilot-1
            suites: copilot@1/4
            parallel: 1
          - name: copilot-2
            suites: copilot@2/4
            parallel: 1
          - name: copilot-3
            suites: copilot@3/4
            parallel: 1
          # qc and messaging: their 4 groups in one job each, as in tier1 (the rule-script pool and the client host)
          - name: qc
            suites: qc@all/4
            parallel: 1
          - name: messaging
            suites: messaging@all/4
            parallel: 1
          # runtime alone (the settled-background-line goldens failed beside other suites on v1); the runtime suites after it
          - name: runtime
            suites: runtime
            parallel: 1
          - name: cursor
            suites: cursor,cursor-deadline,author
            parallel: 2
          - name: octopus
            suites: octopus,copilot-manager
            parallel: 2
          # qc-worker: 494 s of scenarios in one process on a development machine, 4 shards as in tier1 above
          - name: qc-worker-0
            suites: qc-worker@0/4
            parallel: 1
          - name: qc-worker-1
            suites: qc-worker@1/4
            parallel: 1
          - name: qc-worker-2
            suites: qc-worker@2/4
            parallel: 1
          - name: qc-worker-3
            suites: qc-worker@3/4
            parallel: 1
          # the QC environment suites (policy auto)
          - name: qc-gates-a
            suites: qc-gate-race,qc-gate-grace,qc-gate-lease
            parallel: 2
          - name: qc-gates-b
            suites: qc-gate-idle,qc-gate-lifetime,qc-gate-waiting,qc-rate,qc-proxy
            parallel: 2
          # whole suites of a few minutes each (envscope runs as tdd, with its own environment name)
          - name: small
            suites: repos,envscope,mcp,copilot-deadline,operator,merge-queue
            parallel: 2
    env:
      FACTORY_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB;TrustServerCertificate=True;Encrypt=False;Connect Timeout=30"
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB
          MSSQL_MEMORY_LIMIT_MB: "1024"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 10s
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      # the service container's health check passed before the steps started (the job waits for it); this proves the port answers from the runner
      - name: SQL Server is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "SQL Server answers on 127.0.0.1:1433"; exit 0; fi
            sleep 2
          done
          echo "::error::the SQL Server service container does not answer on port 1433"; exit 1

      - name: Build the gateway and the fake GitHub
        run: |
          set -euo pipefail
          pwsh --version
          for project in tests/FakeGitHub gateway; do
            dotnet build "$project" --configuration Release -nodeReuse:false -p:UseSharedCompilation=false --verbosity quiet
          done

      # Every port Tier 1 listens on is below 50000: a suite's slot range 6100-9199, a group's (and a profiled scenario's) 10000 + 1000 * slot + 100 * n + 0..99 (n at most 9).
      # Linux hands out outgoing (ephemeral) ports from 32768-60999 by default, so a client socket of one suite could take the port a group of a high slot is about to listen on: this moves that range above them,
      # and fails when a suite appended to run.ps1 puts a range into it. The range used to start at 40000, and the suite saga, slot 30, listens on 40000-40999: its jobs failed
      # with exit 3 (the probe of run.ps1: "port ... is already in use") or with a fake that could not bind, in most runs of the job "Tier 1 (saga)".
      - name: Ephemeral ports above the test ports
        run: |
          set -euo pipefail
          slots=$(pwsh -NoProfile -File tests/scenarios/run.ps1 -ListSuites | grep -c .)
          top=$((10000 + 1000 * (slots - 1) + 999))
          if [ "$top" -ge 50000 ]; then echo "::error::the $slots suites of run.ps1 reach port $top, into the ephemeral range 50000-60999: lower the range's start in the workflow only if there is room above the ports"; exit 1; fi
          sudo sysctl -w net.ipv4.ip_local_port_range="50000 60999"
          cat /proc/sys/net/ipv4/ip_local_port_range

      - name: Suites ${{ matrix.suites }} (full tier)
        # below the job's 30 minutes, so that a hung job still uploads its logs and results
        timeout-minutes: 22
        env:
          SUITES: ${{ matrix.suites }}
          PARALLEL: ${{ matrix.parallel }}
          # the fake writes each scenario's record here and the golden files are compared, as in the shards (TEST_GOLDEN unset: compare)
          TEST_WRITES_DIR: ${{ runner.temp }}/writes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suite-logs"
          pwsh -NoProfile -File tests/scenarios/run-all.ps1 -Tier full -NoBuild -Parallel "$PARALLEL" -Suites "$SUITES" -LogDir "$RUNNER_TEMP/suite-logs"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/suite-logs/*.result.json
            ${{ runner.temp }}/suite-logs/*.log
          if-no-files-found: warn
          retention-days: 7

      # the gateway and fake logs of a failed job (the fixtures of the tests only): run-all.ps1 keeps the work directory of a failed job only
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: suite-logs-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/suite-logs/*.err
            ${{ runner.temp }}/suite-logs/work-*/**/gateway*.out
            ${{ runner.temp }}/suite-logs/work-*/**/gateway*.err
            ${{ runner.temp }}/suite-logs/work-*/**/fake.out
            ${{ runner.temp }}/suite-logs/work-*/**/fake.err
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the records of the writes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: writes-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/writes
          if-no-files-found: ignore
          retention-days: 14

  # The quick tests, no suite: the gateway in process (tests/Gateway.Tests, 1,150 tests) in 4 shards by test class
  # (tests/ci/shard-dotnet-tests.py: each class in exactly one shard, the filter of a shard proved against the listing before it runs).
  # PowerShell 7.5 beside every shard (the deploy-overrides script test finds it on the PATH and skips without it). SQL Server beside every shard: the SQL-backed Wolverine host tests of Gateway.Tests (WolverineHostSqlServerTests) return early where
  # FACTORY_TEST_SQL is not set, so a shard never runs without it.
  unit:
    name: Gateway tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACTORY_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB;TrustServerCertificate=True;Encrypt=False;Connect Timeout=30"
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB
          MSSQL_MEMORY_LIMIT_MB: "1024"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 10s
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # ConfigurationTests.DeployOverrides_ScriptAgreesWithThePort runs config/apply-overrides.ps1 with the real PowerShell where one is on the PATH (it needs 7.5)
      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      # the service container's health check passed before the steps started (the job waits for it); this proves the port answers from the runner
      - name: SQL Server is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "SQL Server answers on 127.0.0.1:1433"; exit 0; fi
            sleep 2
          done
          echo "::error::the SQL Server service container does not answer on port 1433"; exit 1

      - name: Build the gateway tests
        run: dotnet build tests/Gateway.Tests --configuration Release -nodeReuse:false -p:UseSharedCompilation=false --verbosity quiet

      # the gateway's rule scripts are a stub in these tests (tests/Gateway.Tests/StubPwsh.cs); only the deploy-overrides script test runs the real PowerShell
      - name: Gateway tests, shard ${{ matrix.shard }} of 4
        run: python3 tests/ci/shard-dotnet-tests.py tests/Gateway.Tests ${{ matrix.shard }} 4 --logger "trx;LogFileName=gateway-tests-${{ matrix.shard }}.trx" --results-directory "$RUNNER_TEMP/gateway-tests"

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-tests-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-tests
          if-no-files-found: ignore
          retention-days: 7

  # The smoke test and the test projects of src/ (the Domain rules and parity tests, the workflows; the SQL-backed Wolverine tests among them
  # need the SQL Server service). The project dependency rules are in Gateway.Tests (ArchitectureTests).
  src:
    name: Smoke and src tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FACTORY_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB;TrustServerCertificate=True;Encrypt=False;Connect Timeout=30"
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Fw1!${{ github.run_id }}-${{ github.run_attempt }}aB
          MSSQL_MEMORY_LIMIT_MB: "1024"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"
          --health-interval 5s --health-timeout 5s --health-retries 30 --health-start-period 10s
    steps:
      - uses: actions/checkout@v6.0.1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      - name: Smoke
        run: pwsh -NoProfile -File tests/smoke.ps1

      # the service container's health check passed before the steps started (the job waits for it); this proves the port answers from the runner
      - name: SQL Server is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1433) 2>/dev/null; then echo "SQL Server answers on 127.0.0.1:1433"; exit 0; fi
            sleep 2
          done
          echo "::error::the SQL Server service container does not answer on port 1433"; exit 1

      - name: Domain, integration and workflow tests
        run: |
          set -euo pipefail
          for project in tests/Fworker.Contracts.Tests tests/Fworker.Domain.Tests tests/Fworker.Integrations.Tests tests/Fworker.Workflow.Tests; do
            dotnet test "$project" --configuration Release -nodeReuse:false -p:UseSharedCompilation=false
          done

  # The image starts without a database (issue 459; since the tdd cutover, W9.9c, also the v2 case): the image of the Dockerfile is built here (the Build's own
  # image job is a sibling of this workflow's caller, not an input of it) and run twice with no FACTORY_DB_CONNECTION, each time on a gateway with no GitHub identity (GH_TOKEN is the vault
  # placeholder unset, so it does not wait for revocations) and with the secrets it requires at start and owner mode (the deployed settings need it; the secrets are made at run time):
  #  1. as uat (FACTORY_ENVIRONMENT=uat, where uat and prod run v1 with no database): /ready answers 200 within two minutes;
  #  2. as tdd with v2 configured (engine.v2Environments names tdd: the file of the image with that one setting made, so that the run means the same before and after the cutover reached the overrides) and no database:
  #     the container stays up, /health answers 200 and /ready answers 503 {"waitingFor":"database"} for at least 30 seconds: v2 is inert, it does not crash and v1 does not take its place (EngineOptions.NoDatabase);
  # Any other answer fails the job with the container's log.
  image-start:
    name: Image starts without a database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Build the image
        run: docker build --file Dockerfile --build-arg VERSION=0.0.0 --tag fworker-start-check:ci .

      - name: Run it without FACTORY_DB_CONNECTION as uat and as tdd with v2 configured
        run: |
          set -euo pipefail
          dev_token="$(openssl rand -hex 24)"; webhook_secret="$(openssl rand -hex 24)"; token_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$dev_token"; echo "::add-mask::$webhook_secret"; echo "::add-mask::$token_secret"
          # the image's own configuration with tdd named for v2 (the cutover pull request does it in config/deploy.overrides.json; this makes the case the same before and after it)
          docker create --name fworker-config fworker-start-check:ci >/dev/null
          docker cp fworker-config:/app/config/instance.json "$RUNNER_TEMP/instance.image.json"
          docker rm fworker-config >/dev/null
          jq '.engine = ((.engine // {}) + {v2Environments: ["tdd"]})' "$RUNNER_TEMP/instance.image.json" > "$RUNNER_TEMP/instance.v2.json"
          chmod 644 "$RUNNER_TEMP/instance.v2.json"

          # start NAME [docker args...]: FACTORY_OWNER_MODE=1 and FACTORY_TOKEN_SECRET are what the deployed app is given (system.json): the image's configuration turns messaging and
          # the manager on, and the gateway refuses to start for either without owner mode (MessagingSettings.Load), and owner mode without a token secret
          start() {
            local name="$1"; shift
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker run --detach --name "$name" --publish 18080:8080 \
              -e FACTORY_DEV_TOKEN="$dev_token" -e FACTORY_WEBHOOK_SECRET="$webhook_secret" -e FACTORY_TOKEN_SECRET="$token_secret" -e FACTORY_OWNER_MODE=1 -e GH_TOKEN=unset \
              "$@" fworker-start-check:ci >/dev/null
            if grep -q '^FACTORY_DB_CONNECTION=' <<<"$(docker exec "$name" env 2>/dev/null || true)"; then echo "::error::the container has FACTORY_DB_CONNECTION set"; exit 1; fi
          }
          running() { [ "$(docker inspect --format '{{.State.Running}}' "$1")" = "true" ]; }
          fail() { echo "::error::$2"; docker logs "$1" 2>&1 | tail -n 80; exit 1; }
          ready_200() {
            local name="$1" code=000
            for i in $(seq 1 60); do
              running "$name" || fail "$name" "the container stopped before it was ready"
              code="$(curl -s -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' http://127.0.0.1:18080/ready || true)"
              [ "$code" = "200" ] && break
              sleep 2
            done
            echo "$name /ready: $code"; cat "$RUNNER_TEMP/ready.json" 2>/dev/null || true; echo
            [ "$code" = "200" ] || fail "$name" "/ready did not answer 200 within 2 minutes (last answer: $code)"
            curl -fsS http://127.0.0.1:18080/_build; echo
            curl -fsS -o /dev/null http://127.0.0.1:18080/health
          }

          echo "== 1. uat, no database"
          start fworker-start-uat -e FACTORY_ENVIRONMENT=uat
          ready_200 fworker-start-uat
          docker rm --force fworker-start-uat >/dev/null

          echo "== 2. tdd, v2 configured, no database: inert"
          start fworker-start-v2 -e FACTORY_ENVIRONMENT=tdd -v "$RUNNER_TEMP/instance.v2.json:/app/config/instance.v2.json:ro" -e FACTORY_CONFIG=/app/config/instance.v2.json
          code=000
          for i in $(seq 1 60); do   # (it answers within two minutes; then it must go on answering the same for 30 seconds)
            running fworker-start-v2 || fail fworker-start-v2 "the container stopped: v2 with no database must stay up"
            code="$(curl -s -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' http://127.0.0.1:18080/ready || true)"
            if [ "$code" = "503" ] && grep -q '"waitingFor":"database"' "$RUNNER_TEMP/ready.json"; then break; fi
            sleep 2
          done
          echo "/ready: $code"; cat "$RUNNER_TEMP/ready.json" 2>/dev/null || true; echo
          if [ "$code" != "503" ] || ! grep -q '"waitingFor":"database"' "$RUNNER_TEMP/ready.json"; then fail fworker-start-v2 "/ready did not answer 503 waitingFor database (last answer: $code)"; fi
          for i in $(seq 1 15); do
            running fworker-start-v2 || fail fworker-start-v2 "the container stopped within 30 seconds of its start"
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/health || true)" = "200" ] || fail fworker-start-v2 "/health did not answer 200"
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ready || true)" = "503" ] || fail fworker-start-v2 "/ready stopped answering 503"
            sleep 2
          done
          docker rm --force fworker-start-v2 >/dev/null

      - name: Stop the containers
        if: always()
        run: docker rm --force fworker-start-uat fworker-start-v2 fworker-config || true

  # Every scenario of every suite runs in exactly one shard: the scenarios each matrix entry lists (run.ps1 -ListScenarios -Suite s, with
  # -Groups n -Group g for a shard, every group of an @all/n), added up, are exactly those of run.ps1 -ListScenarios (the full tier), none
  # twice. Its list of scenarios is what "Tests result" compares the results with.
  coverage:
    name: Every scenario is in exactly one shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.1

      - name: PowerShell ${{ env.PWSH_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pwsh"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"

      - name: Every scenario is in exactly one shard
        run: |
          set -euo pipefail
          export LC_ALL=C
          out="$RUNNER_TEMP/coverage"; mkdir -p "$out"
          run=tests/scenarios/run.ps1
          # (only the lines suite<TAB>scenario<TAB>tier: anything else a script prints is not a scenario)
          scenarios() { grep -P '^[^\t]+\t[^\t]+\t(fast|full)$' || true; }
          list() {   # suite [groups group]: that share's scenarios, appended to sharded.tsv
            local part="$out/part.tsv"
            if [ "$#" -eq 1 ]; then pwsh -NoProfile -File "$run" -ListScenarios -Suite "$1" > "$out/raw.txt"
            else pwsh -NoProfile -File "$run" -ListScenarios -Suite "$1" -Groups "$2" -Group "$3" > "$out/raw.txt"; fi
            scenarios < "$out/raw.txt" > "$part"
            local count; count=$(wc -l < "$part")
            echo "$*: $count scenarios"
            if [ "$count" -eq 0 ]; then echo "::warning::$* lists no scenario (an empty shard)"; fi
            cat "$part" >> "$out/sharded.tsv"
          }
          : > "$out/sharded.tsv"
          specs=$(grep -E '^\s+suites: ' .github/workflows/tests.yml | sed -E 's/^\s+suites: //' | tr ',' '\n')
          for spec in $specs; do
            if [[ "$spec" =~ ^([a-z0-9-]+)@all/([0-9]+)$ ]]; then
              suite="${BASH_REMATCH[1]}"; n="${BASH_REMATCH[2]}"
              for ((g = 0; g < n; g++)); do list "$suite" "$n" "$g"; done
            elif [[ "$spec" =~ ^([a-z0-9-]+)@([0-9]+)/([0-9]+)$ ]]; then
              suite="${BASH_REMATCH[1]}"; g="${BASH_REMATCH[2]}"; n="${BASH_REMATCH[3]}"
              list "$suite" "$n" "$g"
            elif [[ "$spec" =~ ^[a-z0-9-]+$ ]]; then
              list "$spec"
            else
              echo "::error::tests.yml: '$spec' is not a suite, name@g/n or name@all/n"; exit 1
            fi
          done
          pwsh -NoProfile -File "$run" -ListScenarios > "$out/raw.txt"
          scenarios < "$out/raw.txt" | sort > "$out/expected.tsv"
          test -s "$out/expected.tsv" || { echo "::error::run.ps1 -ListScenarios listed no scenario"; exit 1; }
          sort "$out/sharded.tsv" > "$out/sharded.sorted.tsv"
          missing=$(comm -23 "$out/expected.tsv" <(sort -u "$out/sharded.sorted.tsv"))
          extra=$(comm -13 "$out/expected.tsv" <(sort -u "$out/sharded.sorted.tsv"))
          twice=$(uniq -d "$out/sharded.sorted.tsv")
          echo "$(wc -l < "$out/expected.tsv") scenarios in run.ps1 -ListScenarios, $(wc -l < "$out/sharded.sorted.tsv") in the shards"
          bad=0
          if [ -n "$missing" ]; then echo "::error::Scenarios in no shard of tests.yml:"; echo "$missing"; bad=1; fi
          if [ -n "$extra" ]; then echo "::error::Scenarios a shard lists that run.ps1 -ListScenarios does not:"; echo "$extra"; bad=1; fi
          if [ -n "$twice" ]; then echo "::error::Scenarios in more than one shard:"; echo "$twice"; bad=1; fi
          test "$bad" -eq 0
          cp "$out/expected.tsv" "$RUNNER_TEMP/scenario-list.tsv"

      - name: Keep the list of scenarios
        uses: actions/upload-artifact@v7
        with:
          name: scenario-list
          path: ${{ runner.temp }}/scenario-list.tsv
          if-no-files-found: error
          retention-days: 7

  # One outcome under a fixed name, for the job of build.yml that calls this workflow. Its summary has the checks and scenarios of every suite
  # (added up over its shards) and in total, to compare with the last green run; it fails when a listed scenario has no result, which catches a
  # shard that ended early without failing.
  result:
    name: Tests result
    needs: [tier1, coverage, unit, src, image-start]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: suite-results-*
          merge-multiple: true
          path: results

      - name: Download the list of scenarios
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: scenario-list
          path: expected

      - name: Every listed scenario has a result; checks per suite
        run: |
          python3 - <<'PY'
          import collections, glob, json, os, sys
          def as_list(v):
              return [] if v is None else (v if isinstance(v, list) else [v])
          expected = collections.Counter()
          listed = collections.Counter()
          have_list = os.path.exists('expected/scenario-list.tsv')
          if have_list:
              for line in open('expected/scenario-list.tsv', encoding='utf-8'):
                  f = line.rstrip('\n').split('\t')
                  if len(f) >= 2:
                      expected[(f[0], f[1])] += 1
                      listed[f[0]] += 1
          suites = collections.OrderedDict()
          ran = collections.Counter()
          files = sorted(glob.glob('results/*.result.json'))
          for path in files:
              r = json.load(open(path, encoding='utf-8-sig'))
              s = suites.setdefault(r.get('suite') or '?', dict(results=0, groups=0, scenarios=0, checks=0, inScenarios=0, failed=0, quarantined=0))
              s['results'] += 1
              s['groups'] += int(r.get('groups') or 1)
              s['checks'] += int(r.get('checks') or 0)
              s['failed'] += int(r.get('failed') or 0)
              s['quarantined'] += len([q for q in as_list(r.get('quarantined')) if q])
              for sc in as_list(r.get('scenarios')):
                  s['scenarios'] += 1
                  s['inScenarios'] += int(sc.get('checks') or 0)
                  ran[(sc.get('suite'), sc.get('name'))] += 1
          out = []
          out.append('### Tier 1: checks and scenarios per suite (full tier)')
          out.append('')
          out.append('`checks` is what the suite reports: the checks of its scenarios plus one invariant check per gateway group (no sweep or internal error in its log).')
          out.append('')
          out.append('| suite | result files | groups | scenarios listed | scenarios run | checks | in scenarios | outside scenarios | failed | quarantined |')
          out.append('|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          tot = collections.Counter()
          for name in sorted(set(suites) | set(listed)):
              s = suites.get(name, dict(results=0, groups=0, scenarios=0, checks=0, inScenarios=0, failed=0, quarantined=0))
              row = dict(s, listed=listed.get(name, 0))
              for k, v in row.items(): tot[k] += v
              out.append(f"| {name} | {row['results']} | {row['groups']} | {row['listed']} | {row['scenarios']} | {row['checks']} | {row['inScenarios']} | {row['checks'] - row['inScenarios']} | {row['failed']} | {row['quarantined']} |")
          out.append(f"| **total** | {tot['results']} | {tot['groups']} | {tot['listed']} | {tot['scenarios']} | **{tot['checks']}** | {tot['inScenarios']} | {tot['checks'] - tot['inScenarios']} | {tot['failed']} | {tot['quarantined']} |")
          missing = sorted((expected - ran).elements())
          extra = sorted((ran - expected).elements())
          twice = sorted(k for k, v in ran.items() if v > 1)
          bad = False
          if not have_list:
              out.append(''); out.append('No list of scenarios (the job "Every scenario is in exactly one shard" did not finish): results not compared.'); bad = True
          if not files:
              out.append(''); out.append('No result file of any shard.'); bad = True
          for title, items in (('Listed scenarios without a result', missing), ('Results of scenarios that are not listed', extra), ('Scenarios that ran more than once', twice)):
              if items and have_list:
                  bad = True
                  out.append(''); out.append(f'**{title}: {len(items)}**'); out.append('')
                  out.extend(f'- {s}: {n}' for s, n in items[:200])
          text = '\n'.join(out) + '\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh: fh.write(text)
          sys.exit(1 if bad else 0)
          PY

      - name: Every suite job succeeded
        if: always()
        env:
          TIER1_RESULT: ${{ needs.tier1.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          SRC_RESULT: ${{ needs.src.result }}
          IMAGE_START_RESULT: ${{ needs.image-start.result }}
        run: |
          echo "tier1: ${TIER1_RESULT}, coverage: ${COVERAGE_RESULT}, unit: ${UNIT_RESULT}, src: ${SRC_RESULT}, image-start: ${IMAGE_START_RESULT}"
          test "${TIER1_RESULT}" = "success"
          test "${COVERAGE_RESULT}" = "success"
          test "${UNIT_RESULT}" = "success"
          test "${SRC_RESULT}" = "success"
          test "${IMAGE_START_RESULT}" = "success"
